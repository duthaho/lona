name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lona:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML support for profile reconciliation tests
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Run Lona shell tests
        run: bash tests/run.sh
      - name: Validate enterprise team templates
        run: |
          python -m py_compile scripts/hermes_team.py
          python - <<'PY'
          import json, pathlib, yaml
          root = pathlib.Path('config/hermes')
          roles = json.loads((root/'team/roles.json').read_text())['profiles']
          assert len(roles) == 10
          for role in roles:
              assert yaml.safe_load((root/'profiles'/role/'config.yaml').read_text())['agent']['reasoning_effort']
          assert yaml.safe_load((root/'config.yaml').read_text())['multiplex_profiles'] is True
          PY
      - name: Validate shell syntax
        run: bash -n deploy.sh scripts/*.sh tests/*.sh
      - name: Validate Compose model
        env:
          HERMES_DASHBOARD_PASSWORD: ci-dashboard
          HERMES_API_SERVER_KEY: ci-hermes-api
          COHUB_API_TOKEN: ci-cohub-token
        run: |
          cp .env.example .env
          docker compose --profile hermes config --quiet
      - name: Build Cohub image
        run: docker build -t lona-cohub:ci apps/cohub

  cohub:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: apps/cohub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/cohub/package-lock.json
      - name: Build and test Cohub dashboard
        run: |
          npm ci
          npm test
          npm run build
      - name: Install browser for dashboard smoke tests
        if: matrix.python-version == '3.13'
        run: npx playwright install --with-deps chromium
      - name: Run responsive dashboard smoke tests
        if: matrix.python-version == '3.13'
        run: npm run test:e2e
      - name: Run Cohub tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Validate sources
        run: python -m py_compile cohub/*.py
      - name: Exercise restart-safe demo
        run: python -m cohub --data-dir /tmp/cohub-ci demo --approve
