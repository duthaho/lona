name: lona

services:
  # ----------------------------------------------------------
  # Multica AI Agent Platform — https://github.com/multica-ai/multica
  # Enable with: docker compose -f docker-compose.multica.yml --profile multica up -d
  # Frontend : http://127.0.0.1:3000  (SSH tunnel to access)
  # Backend  : http://127.0.0.1:8083  (SSH tunnel to access)
  # ----------------------------------------------------------
  multica-postgres:
    profiles: ["multica"]
    image: pgvector/pgvector:pg17
    container_name: lona-multica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: multica
      POSTGRES_PASSWORD: ${MULTICA_POSTGRES_PASSWORD:?run ./deploy.sh multica up to generate}
    volumes:
      - multica-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multica -d multica"]
      interval: 5s
      timeout: 5s
      retries: 10

  multica-backend:
    profiles: ["multica"]
    image: ${MULTICA_BACKEND_IMAGE:-ghcr.io/multica-ai/multica-backend}:${MULTICA_IMAGE_TAG:-latest}
    container_name: lona-multica-backend
    restart: unless-stopped
    depends_on:
      multica-postgres:
        condition: service_healthy
    env_file: .env
    # Validate before invoking the image's original entrypoint. URI delimiters
    # would otherwise make the backend use a different password than Postgres.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$$MULTICA_POSTGRES_PASSWORD" in
          ''|*[!a-zA-Z0-9._~-]*)
            echo 'MULTICA_POSTGRES_PASSWORD must contain only URI-unreserved ASCII characters (letters, digits, . _ ~ -); existing password was not changed.' >&2
            exit 1 ;;
        esac
        exec ./entrypoint.sh
    environment:
      MULTICA_POSTGRES_PASSWORD: ${MULTICA_POSTGRES_PASSWORD:?run ./deploy.sh multica up to generate}
      DATABASE_URL: postgres://multica:${MULTICA_POSTGRES_PASSWORD:?run ./deploy.sh multica up to generate}@multica-postgres:5432/multica?sslmode=disable
      JWT_SECRET: ${MULTICA_JWT_SECRET:?run ./deploy.sh multica up to generate}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:3000}
      MULTICA_APP_URL: ${FRONTEND_ORIGIN:-http://127.0.0.1:3000}
      PORT: "8080"
      APP_ENV: ${MULTICA_APP_ENV:-production}
      MULTICA_DEV_VERIFICATION_CODE: ${MULTICA_DEV_VERIFICATION_CODE:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      ALLOW_SIGNUP: ${MULTICA_ALLOW_SIGNUP:-true}
      ALLOWED_EMAILS: ${MULTICA_ALLOWED_EMAILS:-}
      DO_NOT_TRACK: "1"
      # Reuse OpenRouter key for Multica's internal LLM helpers (title gen, follow-ups).
      MULTICA_LLM_API_KEY: ${OPENROUTER_API_KEY:-}
      MULTICA_LLM_BASE_URL: ${MULTICA_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      MULTICA_LLM_DEFAULT_MODEL: ${MULTICA_LLM_DEFAULT_MODEL:-anthropic/claude-haiku-5.5}
      MULTICA_VCS_INTEGRATION_ENABLED: "true"
      MULTICA_VCS_SECRET_KEY: ${MULTICA_VCS_SECRET_KEY:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      MULTICA_TELEGRAM_SECRET_KEY: ${MULTICA_TELEGRAM_SECRET_KEY:-}
    volumes:
      - multica-uploads:/app/data/uploads
    ports:
      - "${MULTICA_BACKEND_BIND:-127.0.0.1}:${MULTICA_BACKEND_PORT:-8083}:8080"
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "wget -qO- http://127.0.0.1:8080/api/config >/dev/null 2>&1"
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  multica-frontend:
    profiles: ["multica"]
    image: ${MULTICA_WEB_IMAGE:-ghcr.io/multica-ai/multica-web}:${MULTICA_IMAGE_TAG:-latest}
    container_name: lona-multica-frontend
    restart: unless-stopped
    depends_on:
      - multica-backend
    environment:
      HOSTNAME: "0.0.0.0"
      REMOTE_API_URL: http://multica-backend:8080
    ports:
      - "${MULTICA_FRONTEND_BIND:-127.0.0.1}:${MULTICA_FRONTEND_PORT:-3000}:3000"

volumes:
  multica-pgdata:
  multica-uploads:

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: "${DOCKER_MTU:-1200}"
