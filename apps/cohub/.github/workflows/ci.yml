name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m py_compile cohub/*.py
      - name: Check dashboard JavaScript
        run: node --check cohub/static/app.js
      - name: Exercise restart-safe demo
        run: python -m cohub --data-dir /tmp/cohub-ci demo --approve
