name: lona

services:
  # ----------------------------------------------------------
  # OpenClaw gateway — https://docs.openclaw.ai/install/docker
  # Enable with: docker compose --profile openclaw up -d
  # ----------------------------------------------------------
  openclaw:
    profiles: ["openclaw"]
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    container_name: lona-openclaw
    restart: unless-stopped
    # Secrets are read from .env via env_file, so the file always wins over
    # variables exported in the calling shell.
    env_file: .env
    environment:
      # Renamed variables and constants only.
      GEMINI_API_KEY: ${GOOGLE_API_KEY:-}
      OPENCLAW_GATEWAY_PORT: "18789"
    volumes:
      # Config (openclaw.json), credentials, agent state, workspace
      - ./data/openclaw:/home/node/.openclaw
      # Encryption key for OAuth token storage — required for subscription
      # auth (ChatGPT/Claude) to survive container recreation
      - ./data/openclaw-secret:/home/node/.config/openclaw
    ports:
      - "${OPENCLAW_BIND:-127.0.0.1}:${OPENCLAW_PORT:-18789}:18789"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ----------------------------------------------------------
  # Hermes Agent gateway — https://github.com/NousResearch/hermes-agent
  # Enable with: docker compose --profile hermes up -d
  # Telegram uses long polling — no inbound port needed for chat.
  # ----------------------------------------------------------
  hermes:
    profiles: ["hermes"]
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: lona-hermes
    restart: unless-stopped
    command: gateway run
    # Secrets are read from .env via env_file, so the file always wins over
    # variables exported in the calling shell.
    env_file: .env
    environment:
      # Renamed variables and constants only.
      # Default-deny for unknown users on every channel
      GATEWAY_ALLOW_ALL_USERS: "false"
      # Web dashboard (published on loopback below); auth is mandatory
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:?run ./deploy.sh to generate}
      # Internal Runs API for Cohub. Port 8642 stays on the Compose network.
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?run ./deploy.sh to generate}
    volumes:
      # All Hermes state: config.yaml, .env, memories, skills, sessions, cron
      - ./data/hermes:/opt/data
    ports:
      - "${HERMES_DASHBOARD_BIND:-127.0.0.1}:9119:9119"

  # ----------------------------------------------------------
  # Cohub personal-coworker control plane for Hermes
  # Dashboard is loopback-only by default; Hermes API stays internal.
  # ----------------------------------------------------------
  cohub:
    profiles: ["hermes"]
    build:
      context: ./apps/cohub
    container_name: lona-cohub
    restart: unless-stopped
    env_file: .env
    environment:
      COHUB_API_TOKEN: ${COHUB_API_TOKEN:?run ./deploy.sh to generate}
      HERMES_API_BASE: http://hermes:8642
      HERMES_API_KEY: ${HERMES_API_SERVER_KEY:?run ./deploy.sh to generate}
    command: ["--data-dir", "/data", "serve", "--host", "0.0.0.0", "--port", "8765", "--executor", "hermes"]
    volumes:
      - ./data/cohub:/data
    ports:
      - "${COHUB_BIND:-127.0.0.1}:${COHUB_PORT:-8765}:8765"
    depends_on:
      - hermes
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8765/api/health',headers={'Authorization':'Bearer '+os.environ['COHUB_API_TOKEN']}); raise SystemExit(0 if urllib.request.urlopen(r,timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

# Some hosts (jumbo-frame NICs, tunnelled/overlay egress) have a reduced path
# MTU to Telegram's data centers with ICMP "frag needed" filtered — a PMTUD
# black hole: TCP connects but the TLS/response packets are silently dropped,
# so long-polling hangs on "Bad Gateway"/timeouts. Capping the bridge MTU
# keeps every packet under that path limit. Override via DOCKER_MTU in .env.
networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: "${DOCKER_MTU:-1200}"
