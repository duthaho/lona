# Hermes Agent config — seeded to data/hermes/config.yaml on first deploy.
# Edit that copy or run: ./deploy.sh hermes config

model:
  provider: openrouter
  default: nvidia/nemotron-3-ultra-550b-a55b:free   # free; Gemini alt: provider: gemini + gemini-3.6-flash

# Failover on 429 / overload. Free by default ($0). If you have OpenRouter
# credit, a cheap paid model here keeps the bot alive when the free daily cap
# (50/day, 1,000 after a $10 top-up) is hit — e.g. model: openai/gpt-oss-120b
fallback_model:
  provider: openrouter
  model: nvidia/nemotron-3-super-120b-a12b:free

terminal:
  backend: local

agent:
  max_turns: 100        # cap tool iterations/turn (default 500); saves free quota
  api_max_retries: 1    # fail over fast instead of retrying a flaky primary

# Hard-stop runaway tool loops (weak models loop more, loops burn quota).
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true

# Deterministic (no-LLM) prune of stale tool output + compact idle threads.
compression:
  proactive_prune_tokens: 48000
  idle_compact_after_seconds: 1800
  protect_first_n: 0

# Background tasks (summaries, titles) stay on free models with low concurrency.
auxiliary:
  free_only: true
  openrouter_model: nvidia/nemotron-3-nano-30b-a3b:free
  compression:
    max_concurrency: 2
    reasoning_effort: "low"
  title_generation:
    max_concurrency: 2
  session_search:
    max_concurrency: 2

# Tool groups the model may call (`hermes tools list`). Balanced set: keep
# terminal (most skills need it), drop browser/desktop/image-video. Applies on /reset.
platform_toolsets:
  telegram: [web, vision, file, terminal, skills, memory, session_search, todo, cronjob, clarify, messaging]
  # Stricter, no-shell (breaks terminal-backed skills): [web, vision, file, skills, memory, session_search, todo, clarify, messaging]

# Remember prefs/projects across chats; auto-save (single-owner bot).
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false

# Self-improving skills: agent saves its own SKILL.md and reloads them later.
# Only touches agent-created skills, never deletes (archive + backup). Free sweep.
curator:
  enabled: true
  consolidate: false      # keep the aux-model consolidation pass off (costs tokens)
  stale_after_days: 45
  archive_after_days: 120
  backup:
    enabled: true

provider_routing:
  sort: "throughput"      # free models are $0 either way; pick the fastest host

platforms:
  telegram:
    extra:
      require_mention: true   # groups: reply only to @mentions/replies/commands (DMs always answered)

streaming:
  enabled: true           # progressive message edits while replying
