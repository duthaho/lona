# Multica host daemon tuning — installed by scripts/setup-daemon.sh into
# ~/.config/systemd/user/multica-daemon.service.d/tuning.conf
#
# The daemon is a HOST process (not Docker); deploy.sh multica up does not
# manage it. These vars are read from the daemon's process environment and
# take effect on the next daemon start/restart — this file never restarts a
# running daemon.
#
# Durations accept Go syntax: 30s, 10m, 2h, 336h.

[Service]
# ── Garbage collection: reclaim multica_workspaces disk ──────────────────────
# INTERVAL is the sweep cadence (default 2h). The TTLs below only bound age;
# nothing is removed until the next sweep, so INTERVAL governs how fast disk
# is reclaimed between runs.
Environment="MULTICA_GC_ENABLED=true"
Environment="MULTICA_GC_INTERVAL=1h"
Environment="MULTICA_GC_TTL=6h"
Environment="MULTICA_GC_COMPLETED_TASK_TTL=48h"
Environment="MULTICA_GC_ORPHAN_TTL=6h"
Environment="MULTICA_GC_ARTIFACT_TTL=2h"
Environment="MULTICA_GC_TASK_TEMP_LEGACY_TTL=6h"

# ── Other daemon knobs (optional) ────────────────────────────────────────────
# Commented = currently at binary defaults on the reference host. Uncomment and
# adjust PER HOST — max_concurrent_tasks is sized to the machine's CPU/RAM, so
# copying 20 onto a smaller box can exhaust memory. Values shown are the
# reference host's resolved defaults.
#Environment="MULTICA_DAEMON_MAX_CONCURRENT_TASKS=20"
#Environment="MULTICA_DAEMON_AUTO_UPDATE=false"
#Environment="MULTICA_DAEMON_POLL_INTERVAL=30s"
#Environment="MULTICA_DAEMON_HEARTBEAT_INTERVAL=15s"
#Environment="MULTICA_DAEMON_WS_CLAIM_POLL_INTERVAL=3m"
#Environment="MULTICA_AGENT_IDLE_WATCHDOG=2h"
#Environment="MULTICA_AGENT_TOOL_WATCHDOG=2h"
#Environment="MULTICA_AGENT_TIMEOUT=0s"
#Environment="MULTICA_CODEX_SEMANTIC_INACTIVITY_TIMEOUT=2h"
